<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FurnWalk | Official Website | Premium Furniture</title>
    
    <!-- Fonts matching the original -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@100;300;400;700;900&family=Open+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS for rapid layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Open Sans"', 'sans-serif'],
                        lato: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- HLS.js for m3u8 video streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        /* CSS Scroll Snapping configuration */
        .snap-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100vh;
            scroll-behavior: smooth;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        
        .snap-container::-webkit-scrollbar {
            display: none; /* Hide scrollbar for Chrome, Safari and Opera */
        }

        .snap-section {
            scroll-snap-align: start;
            height: 100vh;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        
        /* Subtle bottom gradient to ensure text readability */
        .overlay-gradient {
            background: linear-gradient(to top, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,0) 100%);
        }

        .header-transparent {
            background-color: transparent;
            color: white;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .header-solid {
            background-color: white;
            color: black;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        
        .play-pause-btn {
            transition: transform 0.2s ease;
        }
        .play-pause-btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body class="bg-black m-0 p-0 font-sans antialiased overflow-hidden">

    <!-- Fixed Header -->
    <header id="main-header" class="fixed top-0 left-0 w-full z-50 header-transparent flex items-center justify-between px-6 py-4 h-[91px]">
        <!-- Left: Menu Burger -->
        <!-- Left: Menu Burger -->

          <i class="fas fa-bars text-xl"></i>
          <span class="hidden md:block uppercase text-xs font-semibold tracking-widest">Menu</span>
        </div>

        <!-- Center: Logo -->
        <div class="absolute left-1/2 transform -translate-x-1/2 cursor-pointer">
            <img src="./assets/alu.png" alt="FurnWalk Logo" class="h-8 md:h-24">
        </div>

        <!-- Right: Utility Icons -->
        <div class="flex items-center gap-5 md:gap-6">
            <i class="fas fa-search text-lg cursor-pointer hover:opacity-70 transition"></i>
            <i class="fas fa-map-marker-alt text-lg cursor-pointer hover:opacity-70 transition hidden md:block"></i>
            <i class="fas fa-user text-lg cursor-pointer hover:opacity-70 transition"></i>
        </div>
    </header>

    <!-- Sidebar Menu -->
<div id="side-menu" class="fixed top-0 left-0 w-full sm:w-[400px] h-full bg-white text-black z-[100] transform -translate-x-full transition-transform duration-500 ease-[cubic-bezier(0.25,1,0.5,1)] shadow-2xl flex flex-col">
    <!-- Menu Header -->
    <div class="flex items-center justify-between px-8 py-6 border-b border-gray-100">
        <span class="uppercase text-xs font-bold tracking-[0.2em]">Menu</span>
        <button id="close-menu-btn" class="text-xl text-gray-400 hover:text-black transition">
            <i class="fas fa-times"></i>
        </button>
    </div>
    
    <!-- Menu Links -->
    <nav class="flex-1 overflow-y-auto px-8 py-8 flex flex-col gap-6 font-lato">
        
        <!-- Spaces Dropdown Container -->
        <div>
            <button id="spaces-btn" class="w-full flex items-center justify-between text-xl font-light hover:text-gray-500 transition tracking-wide">
                Spaces
                <i id="spaces-icon" class="fas fa-chevron-down text-sm transition-transform duration-300"></i>
            </button>
            
            <!-- Dropdown Links -->
            <div id="spaces-dropdown" class="hidden flex-col gap-4 pl-4 pt-5 text-gray-500 font-sans text-sm tracking-widest uppercase">
                <a href="./test.html" class="hover:text-black transition">Luxury Home</a>
                <a href="#" class="hover:text-black transition">Office/WorkSpace</a>
                <a href="#" class="hover:text-black transition">Hotels</a>
                <a href="#" class="hover:text-black transition">Events</a>
                <a href="#" class="hover:text-black transition">Institution</a>
            </div>
        </div>
        
        <a href="#" class="text-xl font-light hover:text-gray-500 transition tracking-wide">About Us</a>
        <a href="#" class="text-xl font-light hover:text-gray-500 transition tracking-wide">Contact</a>
    </nav>
</div>

<!-- Dark Backdrop -->
<div id="menu-backdrop" class="fixed inset-0 bg-black/60 z-[90] hidden opacity-0 transition-opacity duration-500 cursor-pointer"></div>

    <!-- Scroll Snapping Container -->
    <main class="snap-container" id="scroll-container">

        <!-- Section 1: Conversation Video -->
        <section class="snap-section">
            <video class="hls-video w-full h-full object-cover" 
                   data-src="https://embed-ssl.wistia.com/deliveries/b436a233a7f9816f85a407220ecd51960af36a99.m3u8" 
                   poster="https://embed-ssl.wistia.com/deliveries/a1c0f3aff7674a95974c12e5236667e81c5d783f.jpg?image_crop_resized=1920x1080"

            <div class="absolute inset-0 overlay-gradient pointer-events-none"></div>

            <div class="absolute bottom-12 left-6 md:left-12 text-white z-10">

                <p class="font-light text-lg md:text-xl mb-4">designed by Philippe Bouix</p>
                <a href="#" class="inline-flex items-center gap-2 text-sm font-semibold uppercase tracking-wider hover:opacity-70 transition">

            </div>

            <button class="play-pause-btn absolute bottom-12 right-6 md:right-12 text-white text-2xl z-10">

        </section>

        <!-- Section 2: Deltalis Image -->
        <section class="snap-section">
            <img src="https://www.roche-bobois.com/on/demandware.static/-/Library-Sites-roche-bobois/default/dwc6ce4bb8/Home/SliderPrincipal/Produits-2025-2/Deltalis_Desktop.jpg" 
                 class="w-full h-full object-cover" alt="Deltalis">
            
            <div class="absolute inset-0 overlay-gradient pointer-events-none"></div>

            <div class="absolute bottom-12 left-6 md:left-12 text-white z-10">
                <h2 class="font-lato text-4xl md:text-5xl font-bold mb-2">Deltalis</h2>
                <p class="font-light text-lg md:text-xl mb-4">designed by Maurizio Manzoni</p>
                <a href="#" class="inline-flex items-center gap-2 text-sm font-semibold uppercase tracking-wider hover:opacity-70 transition">
                    <i class="fas fa-chevron-right text-xs"></i> more
                </a>
            </div>
        </section>

        <!-- Section 3: Script Video -->
        <section class="snap-section">
            <video class="hls-video w-full h-full object-cover" 
                   data-src="https://embed-ssl.wistia.com/deliveries/04387e5d15ff005f4a21c26d0182fb1d6234d914.m3u8" 
                   poster="https://embed-ssl.wistia.com/deliveries/de477b65423e24b35931ed56d5f39480b1490c7d.jpg?image_crop_resized=1920x1080" 
                   loop muted playsinline preload="none"></video>
            
            <div class="absolute inset-0 overlay-gradient pointer-events-none"></div>

            <div class="absolute bottom-12 left-6 md:left-12 text-white z-10">
                <h2 class="font-lato text-4xl md:text-5xl font-bold mb-2">Script</h2>
                <p class="font-light text-lg md:text-xl mb-4">designed by Sacha Lakic</p>
                <a href="#" class="inline-flex items-center gap-2 text-sm font-semibold uppercase tracking-wider hover:opacity-70 transition">
                    <i class="fas fa-chevron-right text-xs"></i> more
                </a>
            </div>

            <button class="play-pause-btn absolute bottom-12 right-6 md:right-12 text-white text-2xl z-10">
                <i class="fas fa-pause"></i>
            </button>
        </section>

        <!-- Section 4: Bubble Video -->
        <section class="snap-section">
            <video class="hls-video w-full h-full object-cover" 
                   data-src="https://embed-ssl.wistia.com/deliveries/75498f90a21bc1b3ecda8af2d079da0b9e115bb6.m3u8" 
                   poster="https://embed-ssl.wistia.com/deliveries/d563caab16abbb8af8ac2bea337b8681da38e3b3.jpg?image_crop_resized=1920x1080" 
                   loop muted playsinline preload="none"></video>
            
            <div class="absolute inset-0 overlay-gradient pointer-events-none"></div>

            <div class="absolute bottom-12 left-6 md:left-12 text-white z-10">
                <h2 class="font-lato text-4xl md:text-5xl font-bold mb-2">Bubble</h2>
                <p class="font-light text-lg md:text-xl mb-4">designed by Sacha Lakic</p>
                <a href="#" class="inline-flex items-center gap-2 text-sm font-semibold uppercase tracking-wider hover:opacity-70 transition">
                    <i class="fas fa-chevron-right text-xs"></i> more
                </a>
            </div>

            <button class="play-pause-btn absolute bottom-12 right-6 md:right-12 text-white text-2xl z-10">
                <i class="fas fa-pause"></i>
            </button>
        </section>

        <!-- Section 5: Mah Jong Video -->
        <section class="snap-section">
            <video class="hls-video w-full h-full object-cover" 
                   data-src="https://embed-ssl.wistia.com/deliveries/9988aa4d54c9e77f133cf390efa3ce31ce6ad7f5.m3u8" 
                   poster="https://embed-ssl.wistia.com/deliveries/5d542119ab7ed5f14a41c0795b0f188f526f5bff.jpg?image_crop_resized=1920x1080" 
                   loop muted playsinline preload="none"></video>
            
            <div class="absolute inset-0 overlay-gradient pointer-events-none"></div>

            <div class="absolute bottom-12 left-6 md:left-12 text-white z-10">
                <h2 class="font-lato text-4xl md:text-5xl font-bold mb-2">Mah Jong</h2>
                <p class="font-light text-lg md:text-xl mb-4">designed by Hans Hopfer</p>
                <a href="#" class="inline-flex items-center gap-2 text-sm font-semibold uppercase tracking-wider hover:opacity-70 transition">
                    <i class="fas fa-chevron-right text-xs"></i> more
                </a>
            </div>

            <button class="play-pause-btn absolute bottom-12 right-6 md:right-12 text-white text-2xl z-10">
                <i class="fas fa-pause"></i>
            </button>
        </section>

    </main>

    <!-- Interactive Scripts -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const videos = document.querySelectorAll('.hls-video');
            const header = document.getElementById('main-header');
            const scrollContainer = document.getElementById('scroll-container');

            // 1. Initialize HLS for the Wistia m3u8 videos extracted from the JSON-LD
            videos.forEach(video => {
                const src = video.getAttribute('data-src');
                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(src);
                    hls.attachMedia(video);
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = src;
                }

                // 2. Play/Pause toggle logic per section
                const section = video.closest('.snap-section');
                const btn = section.querySelector('.play-pause-btn');
                if(btn) {
                    btn.addEventListener('click', () => {
                        if (video.paused) {
                            video.play();
                            btn.innerHTML = '<i class="fas fa-pause"></i>';
                        } else {
                            video.pause();
                            btn.innerHTML = '<i class="fas fa-play"></i>';
                        }
                    });
                }
            });

            // 3. Intersection Observer: Autoplay the video ONLY when its section is currently snapped in view
            const observerOptions = {
                root: scrollContainer,
                threshold: 0.6 // Trigger when 60% of the section is visible
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    const btn = entry.target.querySelector('.play-pause-btn');
                    
                    if (entry.isIntersecting) {
                        if (video) {
                            video.play().catch(e => console.log("Autoplay blocked by browser", e));
                            if(btn) btn.innerHTML = '<i class="fas fa-pause"></i>';
                        }
                    } else {
                        if (video) {
                            video.pause();
                            if(btn) btn.innerHTML = '<i class="fas fa-play"></i>';
                        }
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.snap-section').forEach(section => {
                observer.observe(section);
            });

            // --- Menu Toggle Logic ---
            const menuBtn = document.getElementById('menu-btn');
            const closeMenuBtn = document.getElementById('close-menu-btn');
            const sideMenu = document.getElementById('side-menu');
            const menuBackdrop = document.getElementById('menu-backdrop');
            const spacesBtn = document.getElementById('spaces-btn');
            const spacesDropdown = document.getElementById('spaces-dropdown');
            const spacesIcon = document.getElementById('spaces-icon');

            // Open Menu
            menuBtn.addEventListener('click', () => {
                sideMenu.classList.remove('-translate-x-full');
                menuBackdrop.classList.remove('hidden');
                // Small delay to allow 'display: block' to apply before transitioning opacity
                requestAnimationFrame(() => {
                    menuBackdrop.classList.remove('opacity-0');
                });
            });

            // Close Menu Function
            const closeMenu = () => {
                sideMenu.classList.add('-translate-x-full');
                menuBackdrop.classList.add('opacity-0');
                // Wait for transition to finish before hiding the element
                setTimeout(() => {
                    menuBackdrop.classList.add('hidden');
                }, 500); 
            };

            closeMenuBtn.addEventListener('click', closeMenu);
            menuBackdrop.addEventListener('click', closeMenu);

            // Toggle 'Spaces' Dropdown
            spacesBtn.addEventListener('click', () => {
                spacesDropdown.classList.toggle('hidden');
                spacesDropdown.classList.toggle('flex');
                spacesIcon.classList.toggle('rotate-180');
            });

            // 4. Header Background Toggle
            scrollContainer.addEventListener('scroll', () => {
                if (scrollContainer.scrollTop > 50) {
                    header.classList.remove('header-transparent');
                    header.classList.add('header-solid');
                } else {
                    header.classList.remove('header-solid');
                    header.classList.add('header-transparent');
                }
            });
        });
    </script>
</body>
</html>
